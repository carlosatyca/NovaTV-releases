<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>NovaTV · Configurar</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0E14; color: #E8ECF3;
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 18px 48px; }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  h2 { font-size: 14px; color: #4F8CFF; margin: 28px 0 0; text-transform: uppercase; letter-spacing: .6px; }
  .brand { color: #4F8CFF; font-weight: 700; letter-spacing: .5px; }
  p.sub { color: #8A94A6; margin: 0 0 18px; }
  label { display: block; font-size: 14px; color: #8A94A6; margin: 16px 0 6px; }
  input { width: 100%; padding: 14px; font-size: 17px; color: #E8ECF3; background: #151A23;
          border: 1px solid #1F2632; border-radius: 12px; outline: none; }
  input:focus { border-color: #4F8CFF; }
  .row { display: flex; gap: 8px; } .row input { flex: 1; }
  .toggle { flex: none; padding: 0 14px; border-radius: 12px; border: 1px solid #1F2632;
            background: #151A23; color: #8A94A6; font-size: 14px; }
  .hint { font-size: 13px; color: #8A94A6; margin-top: 6px; }
  .ok { color: #30A46C; font-weight: 600; }
  details { margin-top: 18px; } summary { color: #8A94A6; cursor: pointer; }
  button.main { width: 100%; margin-top: 26px; padding: 16px; font-size: 18px; font-weight: 600;
                color: #fff; background: #4F8CFF; border: 0; border-radius: 14px; }
  button.main:disabled { opacity: .6; }
  button.link { background: none; border: 0; color: #4F8CFF; font-size: 16px; font-weight: 600; margin-top: 18px; padding: 0; }
  .card { background: #151A23; border-radius: 16px; padding: 24px; margin-top: 24px; text-align: center; }
  .icon { font-size: 52px; line-height: 1; }
  .card.good .icon { color: #30A46C; } .card.bad .icon { color: #FF6B6B; }
  .lock { font-size: 13px; color: #8A94A6; margin-top: 22px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>
<script>
/*
 * Formulario de configuración de NovaTV.
 * La tele genera un canal y una clave al azar y los pone en el QR (después de "#": nunca se envían a ningún servidor).
 * Los datos se cifran AQUÍ, en el móvil (AES-256-GCM), y viajan cifrados por ntfy.sh hasta la tele.
 */
(function () {
  const RELAY = "https://ntfy.sh/";
  const app = document.getElementById("app");
  const q = new URLSearchParams(location.hash.slice(1));
  const topic = q.get("t") || "";
  const keyB64 = q.get("k") || "";
  let form = q.get("f") || "profile";
  let configured = (q.get("c") || "").split(",").filter(Boolean);

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const b64uToBytes = (s) => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
  const bytesToB64u = (b) => { let s = ""; b.forEach((x) => (s += String.fromCharCode(x))); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

  if (!/^[A-Za-z0-9_-]{16,64}$/.test(topic) || !keyB64 || !window.crypto || !crypto.subtle) {
    app.innerHTML = `<div class="brand">NovaTV</div><div class="card bad"><div class="icon">!</div><h1>Escanea el QR de la tele</h1>
      <p class="sub">Este enlace no es válido o tu navegador no admite cifrado. Abre de nuevo el código QR que aparece en NovaTV.</p></div>`;
    return;
  }

  let keyPromise = crypto.subtle.importKey("raw", b64uToBytes(keyB64), "AES-GCM", false, ["encrypt", "decrypt"]);

  async function encrypt(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new TextEncoder().encode(JSON.stringify(obj));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await keyPromise, data));
    const out = new Uint8Array(iv.length + ct.length); out.set(iv); out.set(ct, iv.length);
    return bytesToB64u(out);
  }
  async function decrypt(text) {
    const all = b64uToBytes(text.trim());
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, await keyPromise, all.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  // ---------- Formularios ----------
  function field(id, label, opts = {}) {
    const done = configured.includes(id);
    const type = opts.secret ? "password" : "text";
    const ph = done ? "Déjalo vacío para mantenerlo" : (opts.placeholder || "");
    const extra = opts.url ? 'inputmode="url"' : (opts.numeric ? 'inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8"' : "");
    const input = opts.toggle
      ? `<div class="row"><input id="${id}" name="${id}" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" ${extra}>
           <button type="button" class="toggle" onclick="var p=document.getElementById('${id}');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Ver':'Ocultar'">Ver</button></div>`
      : `<input id="${id}" name="${id}" type="${type}" value="${esc(opts.value || "")}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" ${extra}>`;
    return `<label for="${id}">${esc(label)} ${done ? '<span class="ok">✓ configurado</span>' : ""}</label>${input}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ""}`;
  }

  function profileForm() {
    const editing = q.get("e") === "1";
    return `
      <div class="brand">NovaTV</div>
      <h1>${editing ? "Editar perfil" : "Añadir perfil"}</h1>
      <p class="sub">Rellena los datos y se enviarán cifrados a la tele.</p>
      <form id="f">
        ${field("name", "Nombre del perfil", { value: q.get("n") || "", placeholder: "Ej.: Salón" })}
        <h2>Lista IPTV (Xtream) · opcional</h2>
        ${field("server", "Servidor", { value: q.get("s") || "", placeholder: "http://servidor.com:8080", url: true,
           hint: "Déjalo vacío si solo vas a usar Descubrir. También puedes pegar el enlace M3U completo." })}
        ${field("username", "Usuario", { value: q.get("u") || "" })}
        ${field("password", "Contraseña", { toggle: true, placeholder: editing ? "Déjala vacía para no cambiarla" : "" })}
        <details><summary>Opciones avanzadas</summary>
          ${field("pin", "PIN del perfil (opcional, 4-8 dígitos)", { secret: true, numeric: true })}
          ${field("epg", "URL de guía XMLTV (opcional)", { url: true, placeholder: "Vacío = la guía de tu proveedor" })}
        </details>
        <button id="send" class="main" type="submit">Enviar a la tele</button>
      </form>
      <div class="lock">🔒 Cifrado de extremo a extremo: solo tu tele puede leer estos datos.</div>`;
  }

  function discoverForm() {
    return `
      <div class="brand">NovaTV</div>
      <h1>Configurar Descubrir</h1>
      <p class="sub">Solo se guardan los campos que rellenes. Se envían cifrados a la tele.</p>
      <form id="f">
        <h2>Catálogo</h2>
        ${field("tmdb", "TMDB · token o clave de API", { secret: true, placeholder: "eyJ…", hint: "themoviedb.org → Ajustes → API." })}
        <h2>Fuentes</h2>
        ${field("stream_url", "AIOStreams · URL del manifest", { url: true, placeholder: "https://…/manifest.json", hint: "Sin filtro de idioma y solo resultados en caché." })}
        ${field("backup_url", "Fuente de respaldo (opcional)", { url: true, placeholder: "https://…/manifest.json" })}
        <h2>Cuentas debrid (para avisarte de la caducidad)</h2>
        ${field("torbox", "TorBox · clave de API", { secret: true })}
        ${field("realdebrid", "Real-Debrid · clave de API", { secret: true })}
        ${field("alldebrid", "AllDebrid · clave de API", { secret: true })}
        ${field("premiumize", "Premiumize · clave de API", { secret: true })}
        <h2>Trakt</h2>
        ${field("trakt_id", "Trakt · Client ID", { secret: true, hint: "trakt.tv/oauth/applications → tu app NovaTV." })}
        ${field("trakt_secret", "Trakt · Client Secret", { secret: true })}
        <button id="send" class="main" type="submit">Enviar a la tele</button>
      </form>
      <div class="lock">🔒 Cifrado de extremo a extremo: solo tu tele puede leer estos datos.</div>`;
  }

  function showResult(ok, title, text, continueLabel) {
    app.innerHTML = `<div class="brand">NovaTV</div>
      <div class="card ${ok ? "good" : "bad"}"><div class="icon">${ok ? "✓" : "!"}</div><h1>${esc(title)}</h1>
      <p class="sub">${esc(text).replace(/\n/g, "<br>")}</p>
      ${continueLabel ? `<button class="main" id="next">${esc(continueLabel)} →</button>` : ""}
      ${!ok ? `<button class="link" id="back">← Volver al formulario</button>` : ""}</div>`;
    const next = document.getElementById("next");
    if (next) next.onclick = () => { form = "discover"; configured = []; render(); };
    const back = document.getElementById("back");
    if (back) back.onclick = () => render(lastValues);
  }

  let lastValues = null;

  function render(values) {
    app.innerHTML = form === "discover" ? discoverForm() : profileForm();
    const f = document.getElementById("f");
    if (values) for (const [k, v] of Object.entries(values)) { const el = f.elements[k]; if (el) el.value = v; }
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("send");
      btn.disabled = true; btn.textContent = "Enviando…";
      const values = {}; new FormData(f).forEach((v, k) => (values[k] = String(v)));
      lastValues = values;
      try {
        // Identificador del envío: la tele lo devuelve y así reconocemos su respuesta sin depender del reloj.
        const nonce = bytesToB64u(crypto.getRandomValues(new Uint8Array(9)));
        const body = await encrypt({ f: form, v: values, n: nonce, ts: Date.now() });
        const r = await fetch(RELAY + topic, { method: "POST", body });
        if (!r.ok) throw new Error("envío " + r.status);
        btn.textContent = "Esperando a la tele…";
        const reply = await waitReply(nonce, (text) => (btn.textContent = text));
        if (!reply) {
          showResult(false, "La tele no responde",
            "Comprueba que la tele sigue mostrando el código QR, que tiene Internet y que debajo del QR pone «Lista para recibir los datos del móvil».");
          return;
        }
        if (reply.stage === "received") {
          showResult(true, "Recibido", "La tele ha recibido y guardado los datos, pero las comprobaciones están tardando. Mira el resultado en la tele.");
          return;
        }
        showResult(!!reply.ok, reply.ok ? "¡Listo!" : "No se ha podido guardar", reply.message || "", reply.ok ? reply.continueLabel : null);
      } catch (e) {
        showResult(false, "No se ha podido enviar", "Revisa la conexión del móvil e inténtalo de nuevo. (" + e.message + ")");
      }
    };
  }

  /**
   * Espera la respuesta cifrada de la tele. Primero llega un acuse ("received") y después el resultado final.
   * Hasta 40 s sin acuse; con acuse, hasta 120 s para el resultado.
   */
  async function waitReply(nonce, onProgress) {
    const start = Date.now();
    let received = null;
    while (Date.now() - start < (received ? 120000 : 40000)) {
      // ntfy.sh limita las peticiones por IP (compartida con la tele): sin prisas.
      await new Promise((res) => setTimeout(res, 4000));
      try {
        const r = await fetch(`${RELAY}${topic}r/json?poll=1&since=all`);
        const lines = (await r.text()).split("\n").filter(Boolean);
        for (const line of lines) {
          const m = JSON.parse(line);
          if (m.event !== "message" || !m.message) continue;
          let reply;
          try { reply = await decrypt(m.message); } catch (_) { continue; /* no es para nosotros */ }
          if (reply.n !== nonce) continue; // respuesta a un envío anterior
          if (reply.stage === "received") {
            if (!received) { received = reply; onProgress("La tele lo ha recibido. Comprobando…"); }
          } else {
            return reply;
          }
        }
      } catch (_) { /* reintentar */ }
    }
    return received;
  }

  render();
})();
</script>
</body>
</html>
